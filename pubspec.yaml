name: flixygo
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  url_launcher: ^6.3.1
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_windows_video: ^1.0.9
  media_kit_libs_android_video: ^1.3.6

  # ── Supabase backend ──
  supabase_flutter: ^2.6.0
  webview_flutter: ^4.9.0
  webview_windows: ^0.4.0

  # ── Added for profile photo (works on Windows/macOS/Linux too, unlike image_picker) ──
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/design/

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  # Remove adaptive icon config to use standard icon (simpler and works better)
  remove_alpha_ios: true
